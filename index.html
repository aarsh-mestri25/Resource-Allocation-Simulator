<div class="shell">
  <aside class="rail">
    <div class="brand"><b>Allocation Simulator</b><span>Smart cloud resource allocation</span></div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <p class="about">Simplified model inspired by Dong (2023), "Agent-based cloud simulation model for resource management", Journal of Cloud Computing. It is not the paper's NetLogo simulator.</p>
  </aside>
  <main class="main" id="app"></main>
</div>

<script>
const ALGOS = [
  { id: 'first', name: 'First-Fit', blurb: 'Takes the first server, in list order, that has enough CPU and memory.' },
  { id: 'best', name: 'Best-Fit', blurb: 'Takes the eligible server with the lowest fit score, so the task fills the tightest gap.' },
  { id: 'worst', name: 'Worst-Fit', blurb: 'Takes the eligible server with the highest fit score, so the most room stays free after placement.' },
  { id: 'random', name: 'Random', blurb: 'Takes a random eligible server. Uses a fixed seed so every run repeats.' },
  { id: 'balanced', name: 'Balanced-Fit', blurb: 'Takes the eligible server whose CPU and memory occupancy end up closest to each other.' }
];

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function newUsage(servers) {
  const u = {};
  servers.forEach(s => { u[s.id] = { cpu: 0, mem: 0, tasks: [] }; });
  return u;
}

// Checks every server for one task and returns the verdict per server plus the chosen one.
function evaluate(servers, usage, task, algo, rng) {
  const rows = servers.map(s => {
    const u = usage[s.id];
    const aCpu = s.cpu - u.cpu, aMem = s.mem - u.mem;
    const row = { id: s.id, name: s.name, aCpu, aMem, eligible: false, score: null, imbalance: null, reason: '' };
    if (s.off) { row.reason = 'powered off'; return row; }
    const lackC = aCpu < task.cpu, lackM = aMem < task.mem;
    if (lackC && lackM) row.reason = 'short on CPU (' + aCpu + ') and memory (' + aMem + ')';
    else if (lackC) row.reason = 'short on CPU (has ' + aCpu + ', needs ' + task.cpu + ')';
    else if (lackM) row.reason = 'short on memory (has ' + aMem + ', needs ' + task.mem + ')';
    else {
      row.eligible = true;
      row.score = ((aCpu - task.cpu) / aCpu + (aMem - task.mem) / aMem) / 2;
      row.imbalance = Math.abs((u.cpu + task.cpu) / s.cpu - (u.mem + task.mem) / s.mem);
    }
    return row;
  });
  const el = rows.filter(r => r.eligible);
  let pick = null;
  if (el.length) {
    switch (algo) {
      case 'first': pick = el[0]; break;
      case 'best': pick = el.reduce((a, b) => b.score < a.score ? b : a); break;
      case 'worst': pick = el.reduce((a, b) => b.score > a.score ? b : a); break;
      case 'random': pick = el[Math.floor(rng() * el.length)]; break;
      case 'balanced': pick = el.reduce((a, b) => b.imbalance < a.imbalance ? b : a); break;
    }
  }
  return { rows, pick };
}

function place(servers, usage, task, algo, rng) {
  const res = evaluate(servers, usage, task, algo, rng);
  if (res.pick) {
    const u = usage[res.pick.id];
    u.cpu += task.cpu; u.mem += task.mem; u.tasks.push(task.id);
  }
  return res;
}

function runWorkload(servers, tasks, algo, seed) {
  const usage = newUsage(servers);
  const rng = mulberry32(seed == null ? 42 : seed);
  const status = {}, assigned = {};
  tasks.forEach(t => {
    const r = place(servers, usage, t, algo, rng);
    status[t.id] = r.pick ? 'allocated' : 'rejected';
    assigned[t.id] = r.pick ? r.pick.id : null;
  });
  return { usage, status, assigned };
}

function computeMetrics(servers, tasks, usage, status, p) {
  p = p || { pIdle: 100, pMax: 250, powerDown: false };
  const on = servers.filter(s => !s.off);
  const capCpu = on.reduce((a, s) => a + s.cpu, 0), capMem = on.reduce((a, s) => a + s.mem, 0);
  let usedCpu = 0, usedMem = 0, power = 0, active = 0;
  servers.forEach(s => {
    const u = usage[s.id];
    usedCpu += u.cpu; usedMem += u.mem;
    if (s.off) return;
    if (u.tasks.length) { active++; power += p.pIdle + (p.pMax - p.pIdle) * (u.cpu / s.cpu); }
    else power += p.powerDown ? 0 : p.pIdle;
  });
  const total = tasks.length;
  const allocated = tasks.filter(t => status[t.id] === 'allocated').length;
  const rejected = tasks.filter(t => status[t.id] === 'rejected').length;
  return {
    total, allocated, rejected, waiting: total - allocated - rejected,
    successRate: total ? allocated / total * 100 : 0,
    cpuUtil: capCpu ? usedCpu / capCpu * 100 : 0,
    memUtil: capMem ? usedMem / capMem * 100 : 0,
    capCpu, capMem, usedCpu, usedMem, active, power
  };
}




const VIEWS = [['dashboard', 'Dashboard'], ['servers', 'Servers'], ['tasks', 'Tasks'], ['simulator', 'Simulator'], ['compare', 'Comparison']];
const SERIES = { first: 'var(--s-first)', best: 'var(--s-best)', worst: 'var(--s-worst)', random: 'var(--s-random)', balanced: 'var(--s-balanced)' };
const DEFAULT_SERVERS = [[8, 16], [16, 32], [4, 8], [12, 24]];
const SAMPLE = [['Video Transcoding', 4, 8], ['Web Frontend', 2, 4], ['Analytics DB', 4, 16], ['Batch ETL', 6, 12], ['Cache Node', 1, 8], ['ML Inference', 8, 16], ['API Gateway', 2, 2], ['Log Indexer', 3, 10], ['Backup Job', 2, 6], ['Render Farm', 10, 12]];
const OVERLOAD = [['Video Streaming', 8, 12], ['Database Primary', 6, 24], ['ML Training', 12, 20], ['Web Frontend', 2, 4], ['Search Index', 4, 16], ['Batch ETL', 6, 12], ['Cache Cluster', 2, 16], ['Render Job', 10, 10], ['API Gateway', 2, 2], ['Log Pipeline', 4, 8], ['Backup Job', 3, 10], ['Analytics', 8, 18], ['CI Runner', 4, 6], ['Mail Queue', 1, 4], ['Stream Ingest', 6, 8], ['Notification Hub', 1, 2]];

const st = {
  view: 'dashboard', servers: [], tasks: [], nextSrv: 1, nextTask: 1, algo: 'first', sim: null, trace: null, timer: null, error: '',
  cmp: { sel: { first: true, best: true, worst: true, random: true, balanced: true }, pIdle: 100, pMax: 250, powerDown: false }
};

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pct = v => Math.round(v) + '%';
const algoName = id => ALGOS.find(a => a.id === id).name;
const tid = n => 'T' + String(n).padStart(3, '0');

function addServer(cpu, mem) { const n = st.nextSrv++; st.servers.push({ id: n, name: 'Server ' + n, cpu, mem, off: false }); }
function addTask(name, cpu, mem) { st.tasks.push({ id: tid(st.nextTask++), name, cpu, mem }); }
function resetServers() { st.servers = []; st.nextSrv = 1; DEFAULT_SERVERS.forEach(d => addServer(d[0], d[1])); }
function loadTasks(list) { st.tasks = []; st.nextTask = 1; list.forEach(t => addTask(t[0], t[1], t[2])); }

function initSim() {
  stopAuto();
  st.sim = { usage: newUsage(st.servers), status: {}, assigned: {}, log: [], rng: mulberry32(42) };
  st.tasks.forEach(t => { st.sim.status[t.id] = 'waiting'; st.sim.assigned[t.id] = null; });
  st.trace = null;
}

function stepSim() {
  const sim = st.sim;
  const task = st.tasks.find(t => sim.status[t.id] === 'waiting');
  if (!task) return false;
  const res = place(st.servers, sim.usage, task, st.algo, sim.rng);
  sim.status[task.id] = res.pick ? 'allocated' : 'rejected';
  sim.assigned[task.id] = res.pick ? res.pick.id : null;
  sim.log.push({ n: sim.log.length + 1, task, pick: res.pick, rows: res.rows });
  st.trace = { task, rows: res.rows, pick: res.pick };
  return true;
}

function runAll() { stopAuto(); while (stepSim()) { } }
function stopAuto() { if (st.timer) { clearInterval(st.timer); st.timer = null; } }
function toggleAuto() {
  if (st.timer) { stopAuto(); return; }
  st.timer = setInterval(() => { if (!stepSim()) stopAuto(); render(); }, 850);
}

function metrics() { return computeMetrics(st.servers, st.tasks, st.sim.usage, st.sim.status, st.cmp); }

/* ---------- shared pieces ---------- */
function meter(label, used, total, unit) {
  const p = total ? used / total * 100 : 0;
  const cls = p >= 100 ? 'full' : p >= 85 ? 'hi' : '';
  return `<div class="meter"><div class="mrow"><span>${label}</span><span class="num">${used} / ${total} ${unit} · ${pct(p)}</span></div><div class="bar"><i class="${cls}" style="width:${Math.min(100, p)}%"></i></div></div>`;
}
function serverStatus(s) { return s.off ? 'off' : st.sim.usage[s.id].tasks.length ? 'active' : 'idle'; }
function serverCard(s, mark) {
  const u = st.sim.usage[s.id], status = serverStatus(s);
  const cls = ['srv', s.off ? 'off' : '', mark || ''].join(' ');
  const chips = u.tasks.length ? u.tasks.map(t => `<span class="chip">${t}</span>`).join('') : '<span class="none">No tasks</span>';
  return `<article class="${cls}"><header><h3>${esc(s.name)}</h3><span class="pill ${status}">${status}</span></header>${meter('CPU', u.cpu, s.cpu, 'cores')}${meter('Memory', u.mem, s.mem, 'GB')}<div class="chips">${chips}</div></article>`;
}
function statusPill(s) { return `<span class="pill ${s}">${s}</span>`; }
function head(title, text, right) { return `<div class="head"><div><h1>${title}</h1><p>${text}</p></div>${right || ''}</div>`; }

function hbar(title, items, max, fmt, scale) {
  const rows = items.map(i => `<div class="crow"><span class="nm" title="${esc(i.label)}">${esc(i.label)}</span><div class="track"><i style="width:${max ? Math.min(100, i.value / max * 100) : 0}%;--c:${i.color || 'var(--accent)'}"></i></div><span class="val">${fmt(i.value)}</span></div>`).join('');
  return `<div class="chart"><h3>${title}<span>${scale}</span></h3>${rows}</div>`;
}

/* ---------- views ---------- */
function viewDashboard() {
  const m = metrics();
  const on = st.servers.filter(s => !s.off).length;
  const stat = (label, v, sub, cls) => `<div class="stat ${cls || ''}"><span class="eyebrow">${label}</span><span class="v">${v}</span><span class="s">${sub}</span></div>`;
  const util = st.servers.map(s => {
    const u = st.sim.usage[s.id];
    return [{ label: s.name + ' CPU', value: u.cpu / s.cpu * 100, color: 'var(--accent)' }, { label: s.name + ' Mem', value: u.mem / s.mem * 100, color: 'var(--s-best)' }];
  }).flat();
  const out = [{ label: 'Allocated', value: m.allocated, color: 'var(--good)' }, { label: 'Rejected', value: m.rejected, color: 'var(--bad)' }, { label: 'Waiting', value: m.waiting, color: 'var(--warn)' }];
  return head('Data center overview', `Showing the last run with ${algoName(st.algo)} on ${st.servers.length} servers and ${st.tasks.length} tasks. Change the algorithm in the Simulator.`) +
    `<div class="stats">
      ${stat('Servers', st.servers.length, `${on} powered on · ${m.capCpu} cores · ${m.capMem} GB`)}
      ${stat('Tasks', m.total, `${m.waiting} waiting`)}
      ${stat('Allocated', m.allocated, `${pct(m.successRate)} success rate`, 'good')}
      ${stat('Rejected', m.rejected, 'no server had room', m.rejected ? 'bad' : '')}
      ${stat('CPU use', pct(m.cpuUtil), `${m.usedCpu} of ${m.capCpu} cores`)}
      ${stat('Memory use', pct(m.memUtil), `${m.usedMem} of ${m.capMem} GB`)}
    </div>
    <section class="panel"><h2>Server status</h2><div class="servers">${st.servers.map(s => serverCard(s)).join('') || '<p class="none">No servers yet. Add one on the Servers page.</p>'}</div></section>
    <div class="split even">
      <section class="panel"><div class="chart">${hbar('Utilization by server', util, 100, pct, '0 to 100%')}</div></section>
      <section class="panel"><div class="chart">${hbar('Task outcomes', out, Math.max(1, m.total), v => v, `0 to ${m.total} tasks`)}</div>
        <p class="note">Figures come from the simulation you ran. They are not results from the research paper.</p></section>
    </div>`;
}

function viewServers() {
  const rows = st.servers.map(s => {
    const u = st.sim.usage[s.id], status = serverStatus(s);
    return `<tr><td><b>${esc(s.name)}</b></td>
      <td><input type="number" min="1" step="1" id="cpu-${s.id}" value="${s.cpu}" data-chg="srv-cpu" data-id="${s.id}" aria-label="CPU cores for ${esc(s.name)}"></td>
      <td><input type="number" min="1" step="1" id="mem-${s.id}" value="${s.mem}" data-chg="srv-mem" data-id="${s.id}" aria-label="Memory in GB for ${esc(s.name)}"></td>
      <td class="num">${s.cpu - u.cpu} cores · ${s.mem - u.mem} GB</td>
      <td>${statusPill(status)}</td>
      <td class="num">${u.tasks.length}</td>
      <td><label class="chk"><input type="checkbox" id="pw-${s.id}" ${s.off ? '' : 'checked'} data-chg="srv-power" data-id="${s.id}"> On</label></td>
      <td><button class="btn danger" id="rm-${s.id}" data-act="srv-remove" data-id="${s.id}">Remove</button></td></tr>`;
  }).join('');
  return head('Servers', 'Set the capacity of each server. Any change resets the simulation so every run starts from empty servers.') +
    `<section class="panel"><h2>Add a server</h2>
      <div class="row">
        <div class="field"><label for="new-cpu">CPU cores</label><input type="number" id="new-cpu" min="1" step="1" value="8"></div>
        <div class="field"><label for="new-mem">Memory (GB)</label><input type="number" id="new-mem" min="1" step="1" value="16"></div>
        <button class="btn primary" id="add-srv" data-act="srv-add">Add server</button>
        <button class="btn" id="reset-srv" data-act="srv-reset">Restore the four default servers</button>
      </div><p class="err" role="alert">${esc(st.error)}</p></section>
    <section class="panel"><h2>Fleet</h2><div class="tablewrap"><table>
      <thead><tr><th>Server</th><th>CPU cores</th><th>Memory GB</th><th>Available now</th><th>Status</th><th>Tasks</th><th>Power</th><th></th></tr></thead>
      <tbody>${rows || '<tr><td colspan="8" class="none">No servers. Add one above.</td></tr>'}</tbody></table></div>
      <p class="note">A server is Active when it holds at least one task, Idle when it is on but empty, and Off when switched off. Off servers never receive tasks.</p></section>`;
}

function viewTasks() {
  const sim = st.sim;
  const rows = st.tasks.map(t => {
    const sv = st.servers.find(s => s.id === sim.assigned[t.id]);
    return `<tr><td class="num">${t.id}</td><td>${esc(t.name)}</td><td class="num r">${t.cpu}</td><td class="num r">${t.mem}</td><td>${statusPill(sim.status[t.id])}</td><td>${sv ? esc(sv.name) : '<span class="none">None</span>'}</td><td><button class="btn danger" id="rmt-${t.id}" data-act="task-remove" data-id="${t.id}">Remove</button></td></tr>`;
  }).join('');
  return head('Tasks', 'Each task asks for CPU cores and memory. Tasks stay Waiting until you run the simulator.') +
    `<section class="panel"><h2>Add a task</h2>
      <div class="row">
        <div class="field"><label for="t-name">Task name</label><input class="w-name" type="text" id="t-name" placeholder="Video Processing" maxlength="40"></div>
        <div class="field"><label for="t-cpu">CPU cores</label><input type="number" id="t-cpu" min="1" step="1" value="4"></div>
        <div class="field"><label for="t-mem">Memory (GB)</label><input type="number" id="t-mem" min="1" step="1" value="8"></div>
        <button class="btn primary" id="add-task" data-act="task-add">Add task</button>
      </div><p class="err" role="alert">${esc(st.error)}</p>
      <div class="row"><span class="note">Workloads:</span>
        <button class="btn" id="load-sample" data-act="load-sample">Load sample (10 tasks)</button>
        <button class="btn" id="load-over" data-act="load-over">Load overload (16 tasks)</button>
        <button class="btn danger" id="clear-tasks" data-act="clear-tasks">Clear all</button></div></section>
    <section class="panel"><h2>Task queue <span class="note">· ${st.tasks.length} tasks</span></h2><div class="tablewrap"><table>
      <thead><tr><th>ID</th><th>Name</th><th class="r">CPU</th><th class="r">Memory GB</th><th>Status</th><th>Server</th><th></th></tr></thead>
      <tbody>${rows || '<tr><td colspan="7" class="none">The queue is empty. Add a task or load a workload.</td></tr>'}</tbody></table></div></section>`;
}

function traceHtml() {
  const tr = st.trace;
  if (!tr) return `<p class="none">Press Step to watch the scheduler place the next waiting task. Each server is checked for CPU and memory, then ${algoName(st.algo)} picks one.</p>`;
  const t = tr.task;
  const rows = tr.rows.map(r => {
    const picked = tr.pick && tr.pick.id === r.id;
    const cls = picked ? 'pick' : r.eligible ? 'ok' : 'no';
    const d = r.eligible ? `eligible · fit score ${r.score.toFixed(2)} · after placement ${r.aCpu - t.cpu} cores, ${r.aMem - t.mem} GB free` : r.reason;
    return `<div class="tr-row ${cls}"><span class="l">${esc(r.name)}</span><span class="num">${r.aCpu} cores · ${r.aMem} GB free</span><span class="d">${picked ? '<b>Selected.</b> ' : ''}${d}</span></div>`;
  }).join('');
  let v;
  if (tr.pick) {
    const why = { first: 'it is the first eligible server', best: `it has the lowest fit score (${tr.pick.score.toFixed(2)})`, worst: `it has the highest fit score (${tr.pick.score.toFixed(2)})`, random: 'it was drawn at random from the eligible servers', balanced: `its CPU and memory occupancy end up closest together (gap ${(tr.pick.imbalance * 100).toFixed(0)} points)` }[st.algo];
    const s = st.servers.find(x => x.id === tr.pick.id);
    v = `<div class="verdict">${algoName(st.algo)} chose <b>${esc(s.name)}</b> because ${why}. CPU ${tr.pick.aCpu} → ${tr.pick.aCpu - t.cpu}, memory ${tr.pick.aMem} → ${tr.pick.aMem - t.mem}.</div>`;
  } else v = `<div class="verdict bad">No server has enough CPU and memory. ${esc(t.id)} is rejected.</div>`;
  return `<div class="trace"><div><span class="eyebrow">Incoming task</span><div class="task">${t.id} · ${esc(t.name)} <span class="num">needs ${t.cpu} cores, ${t.mem} GB</span></div></div>${rows}${v}</div>`;
}

function viewSimulator() {
  const sim = st.sim, tr = st.trace;
  const waiting = st.tasks.filter(t => sim.status[t.id] === 'waiting').length;
  const cards = st.servers.map(s => {
    let mark = '';
    if (tr) { const r = tr.rows.find(x => x.id === s.id); mark = tr.pick && tr.pick.id === s.id ? 'picked' : r && r.eligible ? 'elig' : 'inelig'; }
    return serverCard(s, mark);
  }).join('');
  const opts = ALGOS.map(a => `<option value="${a.id}" ${a.id === st.algo ? 'selected' : ''}>${a.name}</option>`).join('');
  const qrows = st.tasks.map(t => `<tr><td class="num">${t.id}</td><td>${esc(t.name)}</td><td class="num r">${t.cpu}</td><td class="num r">${t.mem}</td><td>${statusPill(sim.status[t.id])}</td></tr>`).join('');
  const hrows = sim.log.slice().reverse().map(l => `<tr><td class="num">${l.n}</td><td>${l.task.id} ${esc(l.task.name)}</td><td>${l.pick ? esc(st.servers.find(s => s.id === l.pick.id).name) : '<span class="pill rejected">rejected</span>'}</td><td class="num r">${l.pick ? l.pick.aCpu - l.task.cpu + ' / ' + (l.pick.aMem - l.task.mem) : ''}</td></tr>`).join('');
  const alg = ALGOS.map(a => `<div><b><span class="algo-dot" style="--c:${SERIES[a.id]}"></span>${a.name}</b><span>${a.blurb}</span></div>`).join('');
  return head('Allocation simulator', 'Pick an algorithm, then step through the queue or run it all at once. Changing the algorithm restarts from empty servers.',
    `<div class="row">
      <div class="field"><label for="algo">Algorithm</label><select id="algo" data-chg="algo">${opts}</select></div>
      <button class="btn primary" id="run" data-act="run" ${waiting ? '' : 'disabled'}>Run simulation</button>
      <button class="btn" id="step" data-act="step" ${waiting ? '' : 'disabled'}>Step</button>
      <button class="btn" id="auto" data-act="auto" ${waiting ? '' : 'disabled'}>${st.timer ? 'Pause' : 'Auto-play'}</button>
      <button class="btn" id="reset" data-act="reset">Reset</button></div>`) +
    `<div class="split"><section class="panel"><h2>Servers <span class="note">· ${waiting} waiting</span></h2><div class="servers">${cards}</div></section>
      <section class="panel"><h2>Current decision</h2>${traceHtml()}</section></div>
    <div class="split even"><section class="panel"><h2>Task queue</h2><div class="tablewrap"><table><thead><tr><th>ID</th><th>Name</th><th class="r">CPU</th><th class="r">GB</th><th>Status</th></tr></thead><tbody>${qrows || '<tr><td colspan="5" class="none">No tasks. Add some on the Tasks page.</td></tr>'}</tbody></table></div></section>
      <section class="panel"><h2>Allocation history</h2><div class="tablewrap"><table><thead><tr><th>#</th><th>Task</th><th>Server</th><th class="r">Left CPU / GB</th></tr></thead><tbody>${hrows || '<tr><td colspan="4" class="none">Nothing placed yet.</td></tr>'}</tbody></table></div></section></div>
    <section class="panel"><h2>How each algorithm decides</h2><div class="alist">${alg}</div>
      <p class="note">A server is eligible only if available CPU ≥ required CPU and available memory ≥ required memory. Fit score = ((CPU free − CPU needed) ÷ CPU free + (memory free − memory needed) ÷ memory free) ÷ 2. Balanced-Fit compares |CPU occupancy − memory occupancy| after placement.</p></section>`;
}

function viewCompare() {
  const c = st.cmp;
  const ids = ALGOS.filter(a => c.sel[a.id]).map(a => a.id);
  const res = ids.map(id => {
    const r = runWorkload(st.servers, st.tasks, id, 42);
    return { id, r, m: computeMetrics(st.servers, st.tasks, r.usage, r.status, c) };
  });
  const best = (key, dir) => { if (!res.length) return null; const vals = res.map(x => x.m[key]); return dir > 0 ? Math.max(...vals) : Math.min(...vals); };
  const bs = best('successRate', 1), br = best('rejected', -1), bp = best('power', -1);
  const th = res.map(x => `<th class="r"><span class="algo-dot" style="--c:${SERIES[x.id]}"></span>${algoName(x.id)}</th>`).join('');
  const mrow = (label, f, key, bestV) => `<tr><td>${label}</td>${res.map(x => `<td class="num r ${bestV != null && Math.abs(x.m[key] - bestV) < 1e-9 ? 'best' : ''}">${f(x.m[key])}</td>`).join('')}</tr>`;
  const items = key => res.map(x => ({ label: algoName(x.id), value: x.m[key], color: SERIES[x.id] }));
  const maxP = Math.max(1, ...res.map(x => x.m.power));
  const prow = st.tasks.map(t => `<tr><td class="num">${t.id}</td>${res.map(x => { const sid = x.r.assigned[t.id]; const s = st.servers.find(q => q.id === sid); return `<td>${s ? esc(s.name) : '<span class="pill rejected">rejected</span>'}</td>`; }).join('')}</tr>`).join('');
  const checks = ALGOS.map(a => `<label class="chk"><input type="checkbox" id="sel-${a.id}" ${c.sel[a.id] ? 'checked' : ''} data-chg="cmp-sel" data-id="${a.id}"><span class="algo-dot" style="--c:${SERIES[a.id]}"></span>${a.name}</label>`).join('');
  const body = res.length && st.tasks.length ? `
    <section class="panel"><h2>Results</h2><div class="tablewrap"><table><thead><tr><th>Metric</th>${th}</tr></thead><tbody>
      ${mrow('Allocated tasks', v => v, 'allocated')}
      ${mrow('Allocation success rate', pct, 'successRate', bs)}
      ${mrow('Rejected tasks', v => v, 'rejected', br)}
      ${mrow('CPU utilization', pct, 'cpuUtil')}
      ${mrow('Memory utilization', pct, 'memUtil')}
      ${mrow('Servers in use', v => v, 'active')}
      ${mrow('Estimated power (W)', v => Math.round(v), 'power', bp)}
      </tbody></table></div><p class="note">Green marks the best value for success rate, rejected tasks and power. Utilization measures allocated capacity, so it rises with the number of tasks that fit.</p></section>
    <section class="panel"><div class="charts">
      ${hbar('Allocation success rate', items('successRate'), 100, pct, '0 to 100%')}
      ${hbar('Rejected tasks', items('rejected'), Math.max(1, st.tasks.length), v => v, `0 to ${st.tasks.length}`)}
      ${hbar('CPU utilization', items('cpuUtil'), 100, pct, '0 to 100%')}
      ${hbar('Memory utilization', items('memUtil'), 100, pct, '0 to 100%')}
      ${hbar('Estimated power', items('power'), maxP, v => Math.round(v) + ' W', `0 to ${Math.round(maxP)} W`)}
    </div></section>
    <section class="panel"><h2>Where each task went</h2><div class="tablewrap"><table><thead><tr><th>Task</th>${res.map(x => `<th>${algoName(x.id)}</th>`).join('')}</tr></thead><tbody>${prow}</tbody></table></div></section>`
    : `<section class="panel"><p class="none">Select at least one algorithm and make sure the task queue is not empty.</p></section>`;
  return head('Algorithm comparison', 'Every selected algorithm replays the same task list on the same empty servers. All values are calculated here, none are typed in.') +
    `<section class="panel"><h2>Settings</h2><div class="row">${checks}</div>
      <div class="row">
        <div class="field"><label for="p-idle">Idle power (W)</label><input type="number" id="p-idle" min="0" step="10" value="${c.pIdle}" data-chg="cmp-pidle"></div>
        <div class="field"><label for="p-max">Max power (W)</label><input type="number" id="p-max" min="0" step="10" value="${c.pMax}" data-chg="cmp-pmax"></div>
        <label class="chk"><input type="checkbox" id="p-down" ${c.powerDown ? 'checked' : ''} data-chg="cmp-down"> Power off servers with no tasks</label>
      </div><p class="note">Power per active server = idle + (max − idle) × CPU utilization. These are assumed illustrative values, not the paper's energy model. Random uses a fixed seed.</p></section>` + body;
}

/* ---------- render & events ---------- */
function render() {
  const fid = document.activeElement && document.activeElement.id;
  document.getElementById('nav').innerHTML = VIEWS.map(v => `<a href="#${v[0]}" ${v[0] === st.view ? 'aria-current="page"' : ''}>${v[1]}</a>`).join('');
  const fn = { dashboard: viewDashboard, servers: viewServers, tasks: viewTasks, simulator: viewSimulator, compare: viewCompare }[st.view];
  document.getElementById('app').innerHTML = fn();
  if (fid) { const el = document.getElementById(fid); if (el && !el.disabled) el.focus(); }
}

function route() {
  const h = location.hash.slice(1);
  st.view = VIEWS.some(v => v[0] === h) ? h : 'dashboard';
  st.error = '';
  if (st.view !== 'simulator') stopAuto();
  render();
}

function restart() { initSim(); }
function posInt(id) { const v = Number(document.getElementById(id).value); return Number.isInteger(v) && v >= 1 ? v : null; }

document.getElementById('app').addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  st.error = '';
  if (act === 'srv-add') {
    const cpu = posInt('new-cpu'), mem = posInt('new-mem');
    if (!cpu || !mem) st.error = 'Enter whole numbers of 1 or more for CPU cores and memory.'; else { addServer(cpu, mem); restart(); }
  } else if (act === 'srv-reset') { resetServers(); restart(); }
  else if (act === 'srv-remove') { st.servers = st.servers.filter(s => String(s.id) !== id); restart(); }
  else if (act === 'task-add') {
    const cpu = posInt('t-cpu'), mem = posInt('t-mem');
    const name = document.getElementById('t-name').value.trim() || 'Task ' + st.nextTask;
    if (!cpu || !mem) st.error = 'Enter whole numbers of 1 or more for CPU cores and memory.'; else { addTask(name, cpu, mem); restart(); }
  } else if (act === 'task-remove') { st.tasks = st.tasks.filter(t => t.id !== id); restart(); }
  else if (act === 'load-sample') { loadTasks(SAMPLE); restart(); }
  else if (act === 'load-over') { loadTasks(OVERLOAD); restart(); }
  else if (act === 'clear-tasks') { loadTasks([]); restart(); }
  else if (act === 'run') runAll();
  else if (act === 'step') { stopAuto(); stepSim(); }
  else if (act === 'auto') toggleAuto();
  else if (act === 'reset') restart();
  render();
});

document.getElementById('app').addEventListener('change', e => {
  const el = e.target, k = el.dataset.chg;
  if (!k) return;
  const id = el.dataset.id;
  st.error = '';
  if (k === 'algo') { st.algo = el.value; restart(); }
  else if (k === 'srv-cpu' || k === 'srv-mem') {
    const v = Number(el.value), s = st.servers.find(x => String(x.id) === id);
    if (s && Number.isInteger(v) && v >= 1) { s[k === 'srv-cpu' ? 'cpu' : 'mem'] = v; restart(); }
  } else if (k === 'srv-power') { st.servers.find(x => String(x.id) === id).off = !el.checked; restart(); }
  else if (k === 'cmp-sel') st.cmp.sel[id] = el.checked;
  else if (k === 'cmp-pidle') st.cmp.pIdle = Math.max(0, Number(el.value) || 0);
  else if (k === 'cmp-pmax') st.cmp.pMax = Math.max(0, Number(el.value) || 0);
  else if (k === 'cmp-down') st.cmp.powerDown = el.checked;
  if (st.cmp.pMax < st.cmp.pIdle) st.cmp.pMax = st.cmp.pIdle;
  render();
});

resetServers();
loadTasks(SAMPLE);
initSim();
runAll();
window.addEventListener('hashchange', route);
route();
</script>

</body></html>
